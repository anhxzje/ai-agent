spring:
  application:
    name: aiagent

  datasource:
    url: "jdbc:mysql://localhost:3306/ai_agent"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours

# Danh sách thư mục mà AI Agent được phép truy cập (chống Path Traversal).
# Nếu để trống → cho phép tất cả (chỉ dùng cho dev, KHÔNG dùng production).
agent:
  allowed-paths:
    - ${AGENT_ALLOWED_PATH:D:/AI Agent}